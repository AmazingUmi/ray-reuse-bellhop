name: Bellhop RayReuse quality gate

on:
  push:
    paths:
      - ".github/workflows/bellhop-rayreuse-quality-gate.yml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "Bellhop_RayReuse/**"
      - "test/PlotRead/bellhop_io_py/**"
      - "test/PlotRead/pyproject.toml"
      - "test/PlotRead/tests/**"
      - "test/standard_cases/cases/**"
      - "test/standard_cases/codes/**"
  pull_request:
    paths:
      - ".github/workflows/bellhop-rayreuse-quality-gate.yml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "Bellhop_RayReuse/**"
      - "test/PlotRead/bellhop_io_py/**"
      - "test/PlotRead/pyproject.toml"
      - "test/PlotRead/tests/**"
      - "test/standard_cases/cases/**"
      - "test/standard_cases/codes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rayreuse-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality-gate:
    name: Debug, Release, Python and independence
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"

      - name: Install project Python
        run: uv python install "$(cat .python-version)"

      - name: Sync locked Python environment
        run: uv sync --locked

      - name: Run the shared Bellhop RayReuse quality gate
        env:
          RAYREUSE_BUILD_JOBS: "3"
        run: |
          set -euo pipefail
          uv run bash Bellhop_RayReuse/scripts/quality_gate.sh

      - name: Run formatting, static-analysis and package gates
        env:
          RAYREUSE_BUILD_JOBS: "3"
        run: |
          set -euo pipefail
          uv run bash Bellhop_RayReuse/scripts/engineering_gate.sh
