name: Bellhop Broadband quality gate

on:
  push:
    paths:
      - ".github/workflows/bellhop-broadband-quality-gate.yml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "Bellhop_Broadband/**"
      - "test/PlotRead/bellhop_io_py/**"
      - "test/PlotRead/pyproject.toml"
      - "test/PlotRead/tests/**"
      - "test/standard_cases/cases/**"
      - "test/standard_cases/codes/**"
  pull_request:
    paths:
      - ".github/workflows/bellhop-broadband-quality-gate.yml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "Bellhop_Broadband/**"
      - "test/PlotRead/bellhop_io_py/**"
      - "test/PlotRead/pyproject.toml"
      - "test/PlotRead/tests/**"
      - "test/standard_cases/cases/**"
      - "test/standard_cases/codes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broadband-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fast-quality:
    name: Fast quality (Release CTest, Python, independence)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"

      - name: Install project Python
        run: uv python install "$(cat .python-version)"

      - name: Sync locked Python environment
        run: uv sync --locked

      - name: Run the fast Bellhop Broadband quality gate
        env:
          BROADBAND_BUILD_JOBS: "3"
          BROADBAND_CTEST_JOBS: "2"
        run: |
          set -euo pipefail
          uv run bash Bellhop_Broadband/scripts/quality_gate.sh

  engineering:
    name: Engineering (Debug sanitizer, isolation, format, analysis, package)
    needs: fast-quality
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"

      - name: Install project Python
        run: uv python install "$(cat .python-version)"

      - name: Sync locked Python environment
        run: uv sync --locked

      - name: Run the Bellhop Broadband engineering gate
        env:
          BROADBAND_BUILD_JOBS: "3"
          BROADBAND_CTEST_JOBS: "2"
        run: |
          set -euo pipefail
          uv run bash Bellhop_Broadband/scripts/engineering_gate.sh
