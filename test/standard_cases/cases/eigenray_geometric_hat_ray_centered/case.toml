id = "eigenray_geometric_hat_ray_centered"
description = "Ray-centered geometric-hat eigenray prefix stream"
output_kind = "eigenray"
origin_template = "origin.env.in"
source_references = ["Bellhop_origin/Bellhop/influence.f90 InfluenceGeoHatRayCen ApplyContribution/WriteRay2D", "Bellhop_origin/Bellhop/WriteRay.f90 WriteRay2D"]

[compatibility]
versions = ["origin", "f2cpp", "rayreuse"]

[launch]
sound_speed_at_source_mps = 1500.0
water_depth_m = 100.0
maximum_range_m = 600.0
minimum_angle_deg = -70.0
maximum_angle_deg = 70.0
policy = "shared_fmax"

[validation]
prt_markers = ["VACUUM", "Perfectly RIGID", "Eigenray trace run", "Geometric hat beams in ray-centered coordinates", "Geometric hat beams"]
prt_forbidden_markers = ["THORP volume attenuation added", "Cartesian beams"]

[profiles.single]
frequencies_hz = [1000.0]

[profiles.broadband_smoke]
frequencies_hz = [1000.0, 2000.0]
