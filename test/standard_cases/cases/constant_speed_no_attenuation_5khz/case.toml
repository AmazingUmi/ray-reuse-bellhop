id = "constant_speed_no_attenuation_5khz"
description = "Constant-speed 10 km direct field without volume attenuation"
origin_template = "origin.env.in"
source_references = [
  "Acoustic Toolbox tests/VolAtt/freeB.env",
  "Acoustic Toolbox tests/VolAtt/free_ThorpB.env",
]

[launch]
sound_speed_at_source_mps = 1500.0
water_depth_m = 1000.0
maximum_range_m = 10000.0
minimum_angle_deg = -2.0
maximum_angle_deg = 2.0
policy = "shared_fmax"

[validation]
shd_dimensions = [1, 1, 1, 1, 1, 11, 101]
prt_markers = ["VACUUM", "ACOUSTO-ELASTIC half-space"]
prt_forbidden_markers = ["THORP volume attenuation added"]

[profiles.single]
frequencies_hz = [5000.0]

[profiles.broadband_smoke]
frequencies_hz = [1000.0, 5000.0]

[profiles.broadband_regression]
start_hz = 1000.0
stop_hz = 10000.0
count = 16
