id = "constant_speed_acoustic_bottom"
description = "Constant-speed shallow water with lossy acoustic half-space bottom"
origin_template = "origin.env.in"
source_references = ["Acoustic Toolbox tests/calib/calibB_Cerveny.env"]

[launch]
sound_speed_at_source_mps = 1500.0
water_depth_m = 100.0
maximum_range_m = 5000.0
minimum_angle_deg = -89.0
maximum_angle_deg = 89.0
policy = "shared_fmax"

[validation]
shd_dimensions = [1, 1, 1, 1, 1, 51, 201]
prt_markers = ["VACUUM", "ACOUSTO-ELASTIC half-space"]
prt_forbidden_markers = ["THORP volume attenuation added"]

[profiles.single]
frequencies_hz = [250.0]

[profiles.broadband_smoke]
frequencies_hz = [100.0, 500.0]

[profiles.broadband_regression]
start_hz = 100.0
stop_hz = 1000.0
count = 16
