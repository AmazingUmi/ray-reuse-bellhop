id = "simple_gaussian_cartesian"
description = "Finite constant-speed simple-Gaussian beam case"
origin_template = "origin.env.in"
source_references = [
  "Bellhop_origin/Bellhop/ReadEnvironmentBell.f90 non-Cerveny beam grammar",
  "Bellhop_origin/Bellhop/bellhop.f90 simple-Gaussian dispatch",
  "Bellhop_origin/Bellhop/influence.f90 InfluenceSGB",
]

[compatibility]
versions = ["origin", "f2cpp", "rayreuse"]

[launch]
sound_speed_at_source_mps = 1500.0
water_depth_m = 100.0
maximum_range_m = 250.0
minimum_angle_deg = -60.0
maximum_angle_deg = 60.0
policy = "shared_fmax"

[validation]
shd_dimensions = [1, 1, 1, 1, 1, 7, 21]
prt_markers = [
  "VACUUM",
  "Perfectly RIGID",
  "Simple gaussian beams",
  "Simple Gaussian beams",
]
prt_forbidden_markers = [
  "THORP volume attenuation added",
  "Geometric hat beams in Cartesian coordinates",
  "Geometric gaussian beams in Cartesian coordinates",
  "Cartesian beams",
  "Ray centered beams",
  "Type of beam =",
  "Component",
  "Number of images",
]

[profiles.single]
frequencies_hz = [1000.0]

[profiles.broadband_smoke]
frequencies_hz = [1000.0, 2000.0]

[profiles.broadband_regression]
start_hz = 1000.0
stop_hz = 2500.0
count = 16
