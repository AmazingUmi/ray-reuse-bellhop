id = "geometric_hat_cartesian_safe_control"
description = "Finite constant-speed Cartesian geometric-hat control for I7-06 beam shapes"
origin_template = "origin.env.in"
source_references = [
  "Bellhop_origin/Bellhop/ReadEnvironmentBell.f90 non-Cerveny beam grammar",
  "Bellhop_origin/Bellhop/bellhop.f90 geometric-hat dispatch",
  "Bellhop_origin/Bellhop/influence.f90 InfluenceGeoHatCart",
]

[compatibility]
versions = ["origin", "f2cpp"]

[launch]
sound_speed_at_source_mps = 1500.0
water_depth_m = 100.0
maximum_range_m = 250.0
minimum_angle_deg = -60.0
maximum_angle_deg = 60.0
policy = "shared_fmax"

[validation]
shd_dimensions = [1, 1, 1, 1, 1, 7, 21]
prt_markers = [
  "VACUUM",
  "Perfectly RIGID",
  "Geometric hat beams in Cartesian coordinates",
  "Geometric hat beams",
]
prt_forbidden_markers = [
  "THORP volume attenuation added",
  "Geometric gaussian beams in Cartesian coordinates",
  "Simple gaussian beams",
  "Cartesian beams",
  "Ray centered beams",
  "Type of beam =",
  "Component",
  "Number of images",
]

[profiles.single]
frequencies_hz = [1000.0]
