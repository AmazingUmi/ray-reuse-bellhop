id = "attenuation_unit_l"
description = "Constant-speed field using loss-parameter attenuation input"
origin_template = "origin.env.in"
source_references = ["Bellhop_origin/misc/AttenMod.f90 CRCI unit L"]

[compatibility]
versions = ["origin", "f2cpp", "rayreuse"]

[launch]
sound_speed_at_source_mps = 1500.0
water_depth_m = 1000.0
maximum_range_m = 1000.0
minimum_angle_deg = -2.0
maximum_angle_deg = 2.0
policy = "shared_fmax"

[validation]
shd_dimensions = [1, 1, 1, 1, 1, 11, 101]
prt_markers = ["VACUUM", "ACOUSTO-ELASTIC half-space", "Attenuation units: Loss parameter"]

[profiles.single]
frequencies_hz = [5000.0]

[profiles.broadband_smoke]
frequencies_hz = [4000.0, 5000.0]
