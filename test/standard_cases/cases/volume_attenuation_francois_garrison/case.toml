id = "volume_attenuation_francois_garrison"
description = "Constant-speed direct field with Francois-Garrison volume attenuation"
origin_template = "origin.env.in"
source_references = ["Bellhop_origin/misc/AttenMod.f90 Franc_Garr"]

[compatibility]
versions = ["origin", "f2cpp"]

[launch]
sound_speed_at_source_mps = 1500.0
water_depth_m = 1000.0
maximum_range_m = 10000.0
minimum_angle_deg = -2.0
maximum_angle_deg = 2.0
policy = "shared_fmax"

[validation]
shd_dimensions = [1, 1, 1, 1, 1, 11, 101]
prt_markers = ["VACUUM", "ACOUSTO-ELASTIC half-space", "Francois-Garrison volume attenuation added"]

[profiles.single]
frequencies_hz = [5000.0]

[profiles.broadband_smoke]
frequencies_hz = [5000.0, 10000.0]
