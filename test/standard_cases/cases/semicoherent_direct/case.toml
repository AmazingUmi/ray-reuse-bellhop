id = "semicoherent_direct"
description = "Semi-coherent Cartesian Cerveny field with Lloyd mirror source pattern"
origin_template = "origin.env.in"
source_references = [
  "Bellhop_origin/Bellhop/ReadEnvironmentBell.f90 ReadRunType C/I/S",
  "Bellhop_origin/Bellhop/bellhop.f90 semi-coherent Lloyd mirror pattern",
  "Bellhop_origin/Bellhop/influence.f90 InfluenceCervenyCart incoherent accumulation",
  "Bellhop_origin/Bellhop/influence.f90 ScalePressure intensity conversion",
]

[compatibility]
versions = ["origin", "f2cpp"]

[launch]
sound_speed_at_source_mps = 1500.0
water_depth_m = 1000.0
maximum_range_m = 5000.0
minimum_angle_deg = -5.0
maximum_angle_deg = 5.0
policy = "shared_fmax"

[validation]
shd_dimensions = [1, 1, 1, 1, 1, 21, 51]
prt_markers = ["Semi-coherent TL calculation", "Point source (cylindrical coordinates)", "VACUUM", "ACOUSTO-ELASTIC half-space"]
prt_forbidden_markers = ["Incoherent TL calculation", "Line source (Cartesian coordinates)", "THORP volume attenuation added"]

[profiles.single]
frequencies_hz = [50.0]
