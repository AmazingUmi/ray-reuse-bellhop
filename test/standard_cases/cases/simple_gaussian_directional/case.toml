id = "simple_gaussian_directional"
description = "Directional source beam pattern on Cartesian Simple Gaussian coherent TL"
origin_template = "origin.env.in"
companion_files = ["origin.sbp"]
source_references = [
  "Bellhop_origin/misc/beampattern.f90 ReadPat",
  "Bellhop_origin/Bellhop/bellhop.f90 SrcBmPat interpolation",
  "Bellhop_origin/Bellhop/influence.f90 InfluenceSGB",
  "Bellhop_F2CPP/src/solver/single_frequency_solver.cpp source pattern before projection",
]

[compatibility]
versions = ["origin", "f2cpp", "rayreuse"]

[launch]
sound_speed_at_source_mps = 1500.0
water_depth_m = 100.0
maximum_range_m = 250.0
minimum_angle_deg = -60.0
maximum_angle_deg = 60.0
policy = "shared_fmax"

[validation]
shd_dimensions = [1, 1, 1, 1, 1, 7, 21]
prt_markers = [
  "Coherent TL calculation",
  "Simple gaussian beams",
  "Simple Gaussian beams",
  "Using source beam pattern file",
  "Number of source beam pattern points",
  "VACUUM",
  "Perfectly RIGID",
]
prt_forbidden_markers = [
  "Cartesian beams",
  "Geometric hat beams in Cartesian coordinates",
  "Geometric gaussian beams in Cartesian coordinates",
  "THORP volume attenuation added",
]

[profiles.single]
frequencies_hz = [1000.0]
