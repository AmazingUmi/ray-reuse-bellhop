id = "geometric_gaussian_incoherent"
description = "Incoherent Cartesian geometric-Gaussian field"
origin_template = "origin.env.in"
source_references = [
  "Bellhop_origin/Bellhop/ReadEnvironmentBell.f90 C/I/S and Cartesian geometric-Gaussian grammar",
  "Bellhop_origin/Bellhop/influence.f90 InfluenceGeoGaussianCart intensity accumulation",
  "Bellhop_F2CPP/src/field/geometric_gaussian_influence.cpp production width and contribution order",
]

[compatibility]
versions = ["origin", "f2cpp", "rayreuse"]

[launch]
sound_speed_at_source_mps = 1500.0
water_depth_m = 100.0
maximum_range_m = 250.0
minimum_angle_deg = -60.0
maximum_angle_deg = 60.0
policy = "shared_fmax"

[validation]
shd_dimensions = [1, 1, 1, 1, 1, 7, 21]
prt_markers = [
  "Incoherent TL calculation",
  "Geometric gaussian beams in Cartesian coordinates",
  "Geometric Gaussian beams",
  "Point source (cylindrical coordinates)",
  "VACUUM",
  "Perfectly RIGID",
]
prt_forbidden_markers = [
  "Semi-coherent TL calculation",
  "Cartesian beams",
  "Ray centered beams",
  "Geometric hat beams in Cartesian coordinates",
  "Simple gaussian beams",
]

[profiles.single]
frequencies_hz = [1000.0]

[profiles.broadband_smoke]
frequencies_hz = [1000.0, 2000.0]

[profiles.broadband_regression]
start_hz = 1000.0
stop_hz = 2500.0
count = 16
