id = "arrival_multi_source_binary"
description = "Binary arrivals paired byte-layout counterpart of the two-source geometric-hat ASCII case"
output_kind = "arrivals_binary"
origin_template = "origin.env.in"
source_references = ["Bellhop_origin/Bellhop/influence.f90 InfluenceGeoHatCart ApplyContribution/AddArr", "Bellhop_origin/Bellhop/ArrMod.f90 WriteArrivalsBinary"]

[compatibility]
versions = ["origin", "f2cpp", "rayreuse"]

[launch]
sound_speed_at_source_mps = 1500.0
water_depth_m = 100.0
maximum_range_m = 400.0
minimum_angle_deg = -60.0
maximum_angle_deg = 60.0
policy = "shared_fmax"

[validation]
source_depth_count = 2
prt_markers = ["VACUUM", "Perfectly RIGID", "Geometric hat beams in Cartesian coordinates", "Geometric hat beams"]
# Origin echoes multi-source depths as "Number of Source z-coordinates, Sz";
# F2CPP and RayReuse summarize them as "source depths = N" instead.
version_prt_markers = { f2cpp = ["source depths = 2"], rayreuse = ["source depths = 2"] }
prt_forbidden_markers = ["THORP volume attenuation added", "Ray centered beams"]

[profiles.single]
frequencies_hz = [1000.0]

[profiles.broadband_smoke]
frequencies_hz = [500.0, 1000.0]
