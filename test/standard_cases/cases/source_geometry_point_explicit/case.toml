id = "source_geometry_point_explicit"
description = "Explicit RunType fourth-position R point-source control"
origin_template = "origin.env.in"
source_references = [
  "Bellhop_origin/Bellhop/ReadEnvironmentBell.f90 ReadRunType source geometry",
  "Bellhop_origin/Bellhop/influence.f90 InfluenceCervenyCart source ratio",
  "Bellhop_origin/Bellhop/influence.f90 ScalePressure source spreading",
]

[compatibility]
versions = ["origin", "f2cpp", "rayreuse"]

[launch]
sound_speed_at_source_mps = 1500.0
water_depth_m = 1000.0
maximum_range_m = 5000.0
minimum_angle_deg = -5.0
maximum_angle_deg = 5.0
policy = "shared_fmax"

[validation]
shd_dimensions = [1, 1, 1, 1, 1, 21, 51]
prt_markers = ["VACUUM", "ACOUSTO-ELASTIC half-space", "Point source (cylindrical coordinates)"]
prt_forbidden_markers = ["THORP volume attenuation added", "Line source (Cartesian coordinates)"]

[profiles.single]
frequencies_hz = [50.0]
