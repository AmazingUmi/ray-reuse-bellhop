id = "source_beam_pattern_directional"
description = "Directional source beam pattern with dB-to-amplitude conversion and angle interpolation"
origin_template = "origin.env.in"
companion_files = ["origin.sbp"]
source_references = ["Bellhop_origin/misc/beampattern.f90 ReadPat", "Bellhop_origin/Bellhop/bellhop.f90 SrcBmPat interpolation"]

[compatibility]
versions = ["origin", "f2cpp"]

[launch]
sound_speed_at_source_mps = 1500.0
water_depth_m = 100.0
maximum_range_m = 750.0
minimum_angle_deg = -60.0
maximum_angle_deg = 60.0
policy = "shared_fmax"

[validation]
shd_dimensions = [1, 1, 1, 1, 1, 11, 51]
prt_markers = ["VACUUM", "Perfectly RIGID", "Using source beam pattern file", "Number of source beam pattern points"]
prt_forbidden_markers = ["THORP volume attenuation added"]

[profiles.single]
frequencies_hz = [1000.0]

[profiles.broadband_smoke]
frequencies_hz = [1000.0, 2000.0]
