id = "arrival_zero"
description = "ASCII arrivals: valid source and receiver layout with deliberately empty arrival cells"
output_kind = "arrivals_ascii"
origin_template = "origin.env.in"
source_references = ["Bellhop_origin/Bellhop/influence.f90 InfluenceGeoHatCart", "Bellhop_origin/Bellhop/ArrMod.f90 WriteArrivalsASCII"]

[compatibility]
versions = ["origin", "f2cpp", "rayreuse"]

[launch]
sound_speed_at_source_mps = 1500.0
water_depth_m = 100.0
maximum_range_m = 100.0
minimum_angle_deg = -2.0
maximum_angle_deg = 2.0
policy = "shared_fmax"

[validation]
prt_markers = ["VACUUM", "Perfectly RIGID", "Geometric hat beams in Cartesian coordinates", "Geometric hat beams"]
prt_forbidden_markers = ["THORP volume attenuation added", "Ray centered beams"]

[profiles.single]
frequencies_hz = [1000.0]

[profiles.broadband_smoke]
frequencies_hz = [500.0, 1000.0]
