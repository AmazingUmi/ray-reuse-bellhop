id = "eigenray_irregular_pairs"
description = "Cartesian geometric-hat eigenrays on paired irregular receivers"
output_kind = "eigenray"
origin_template = "origin.env.in"
source_references = ["Bellhop_origin/Bellhop/influence.f90 InfluenceGeoHatCart ApplyContribution/WriteRay2D", "Bellhop_origin/Bellhop/ReadEnvironmentBell.f90 irregular receiver grammar"]

[compatibility]
versions = ["origin", "f2cpp", "rayreuse"]

[launch]
sound_speed_at_source_mps = 1500.0
water_depth_m = 100.0
maximum_range_m = 400.0
minimum_angle_deg = -60.0
maximum_angle_deg = 60.0
policy = "shared_fmax"

[validation]
prt_markers = ["VACUUM", "Perfectly RIGID", "Irregular grid", "Geometric hat beams in Cartesian coordinates", "Geometric hat beams"]
prt_forbidden_markers = ["THORP volume attenuation added", "Ray centered beams"]

[profiles.single]
frequencies_hz = [1000.0]

[profiles.broadband_smoke]
frequencies_hz = [500.0, 1000.0]
