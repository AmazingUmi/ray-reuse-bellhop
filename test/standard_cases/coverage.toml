constant_speed_direct = { tags = ["product:shd", "source:single", "receiver:regular", "geometry:point", "pattern:omni", "beam:cartesian_cerveny", "ssp:constant", "boundary:none"], sets = ["core", "output", "f2cpp_regular"] }
constant_speed_vacuum_rigid = { tags = ["product:shd", "source:single", "receiver:regular", "geometry:point", "pattern:omni", "beam:cartesian_cerveny", "ssp:constant", "boundary:vacuum_rigid"], sets = ["core", "boundary"] }
