schema_version = 1

[sets.core]
description = "Core SHD propagation, reflections and refracting Munk field"
ctest_regex = "f2cpp\\.(component\\.(single_frequency_solver|cartesian_cerveny_influence|geometry_tracer_munk)|unit\\.pressure_scaling)"

[sets.ssp]
description = "SSP interpolation and range-dependent sound speed"
ctest_regex = "f2cpp\\.component\\.(sound_speed_evaluator|c_linear_ssp|pchip_ssp|n2_linear_ssp|cubic_spline_ssp|geometry_tracer_ssp_interface)"

[sets.boundary]
description = "Boundary geometry, material and reflection models"
ctest_regex = "f2cpp\\.component\\.(boundary_geometry|boundary_acoustics|flat_boundary_reflection|geometry_tracer_reflection)"

[sets.attenuation]
description = "Attenuation units and volume attenuation models"
ctest_regex = "f2cpp\\.(unit\\.attenuation|component\\.frequency_projector)"

[sets.source_receiver]
description = "Source count/geometry/pattern and receiver layout"
ctest_regex = "f2cpp\\.(component\\.(environment_parser|single_frequency_solver)|unit\\.pressure_scaling)"

[sets.beam]
description = "Coherence, components and Cartesian/ray-centered beam families"
ctest_regex = "f2cpp\\.(component\\.(cartesian_cerveny_influence|ray_centered_cerveny_influence|geometric_hat_influence|geometric_gaussian_influence|simple_gaussian_influence)|unit\\.beam_epsilon)"

[sets.ray]
description = "Ordinary RAY product"
ctest_regex = "f2cpp\\.component\\.(ray_trace_output|geometry_tracer)"

[sets.arrival]
description = "ASCII/binary Arrival products and accumulation"
ctest_regex = "f2cpp\\.component\\.(arrival_workspace|arrival_solver|arrival_writer|geometric_hat_influence|geometric_gaussian_influence)"

[sets.eigenray]
description = "Eigenray EOF stream and ray-prefix products"
ctest_regex = "f2cpp\\.component\\.(eigenray_solver|eigenray_writer|ray_trace_output|geometric_hat_influence|geometric_gaussian_influence)"

[sets.output]
description = "Representative SHD, RAY, Arrival and Eigenray lifecycle"
ctest_regex = "f2cpp\\.(component\\.(shd_writer|ray_trace_output|arrival_writer|eigenray_writer)|cli\\.output_lifecycle)"

[sets.f2cpp_regular]
description = "Small high-information F2CPP routine regression"
ctest_regex = "f2cpp\\.(unit|component|cli)"

